name: lightning-blog

services:
  blog-db:
    image: postgres:17-alpine
    container_name: lightning-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    volumes:
      - lightning_blog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d blog']
      interval: 10s
      timeout: 5s
      retries: 5

  blog:
    build: .
    container_name: lightning-blog
    restart: unless-stopped
    depends_on:
      blog-db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://blog:blog@blog-db:5432/blog
      PORT: 10004
    ports:
      - '10004:10004'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:10004/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lightning_blog_pgdata:
