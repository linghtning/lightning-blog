version: '3.8'

services:
  blog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog_password
    ports:
      - '15404:5432'
    volumes:
      - blog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog']
      interval: 10s
      timeout: 5s
      retries: 5

  blog:
    build: .
    ports:
      - '10004:10004'
    environment:
      NODE_ENV: production
      PORT: 10004
      DATABASE_URL: postgresql://blog:blog_password@blog-db:5432/blog
      PUBLIC_BASE_URL: http://blog.orgcatfun.site
      PORTAL_BASE_URL: http://orgcatfun.site
      SSO_CALLBACK_URL: http://blog.orgcatfun.site/auth/callback
      OIDC_CLIENT_ID: blog
    depends_on:
      blog-db:
        condition: service_healthy

volumes:
  blog-db-data:
